# dsh-image-compare bundle patch: inserts this plugin into a profile's layer stack.
#
# The plugin is ONE row. Its apply() registers the model-facing tools (host half:
# `view_images` and `browse_images`, plus the two read-only routes the panel reads
# directory listings and image bytes from) and, through the same package's
# `dsh.client` declaration, the paginated image viewer (client half: a Tool card
# and a right-column tab). No other row is touched: the tools read through the
# composed `ctx.fs` and store durable images through the mounted `ctx.attachments`.
- insert:
    - id: dsh-image-compare
      name: 'dsh-image-compare'
